<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>买前尽调 · 二手数码决策卡</title>
<style>
  :root {
    --ink: #101828;
    --ink-2: #344054;
    --muted: #667085;
    --line: #e4ded1;
    --paper: #f3f0e8;
    --card: #fffdf8;
    --amber: #b45309;
    --amber-bg: #fff5e6;
    --green: #157f3c;
    --green-bg: #ecfdf3;
    --red: #b42318;
    --red-bg: #fef3f2;
    --blue: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% -10%, rgba(180,83,9,.07), transparent 32%),
      radial-gradient(circle at 100% 0%, rgba(16,24,40,.05), transparent 28%),
      var(--paper);
    min-height: 100vh;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 36px 20px 80px; }

  /* ---------- header ---------- */
  .hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 26px; }
  .brand { display: flex; gap: 14px; align-items: center; }
  .brand-mark {
    width: 56px; height: 56px; border-radius: 12px; background: var(--ink); color: #fff;
    display: grid; place-items: center; font-size: 28px; font-weight: 800; letter-spacing: 2px;
    box-shadow: 0 8px 20px rgba(16,24,40,.18);
  }
  h1 { margin: 0 0 3px; font-size: 30px; letter-spacing: 3px; }
  .sub { color: var(--muted); font-size: 13.5px; letter-spacing: .4px; }
  .sub b { color: var(--amber); font-weight: 700; }
  .hero-code { text-align: right; color: #98a2b3; font-size: 11px; letter-spacing: 2px; line-height: 1.8; }

  /* ---------- input ---------- */
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 24px; box-shadow: 0 10px 34px rgba(16,24,40,.06);
  }
  .label { font-size: 12.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .5px; margin-bottom: 8px; }
  .search-row { display: flex; gap: 10px; }
  #query {
    flex: 1; height: 50px; border: 1px solid var(--line); border-radius: 10px; padding: 0 16px;
    font: inherit; font-size: 15.5px; background: #fff; outline: none; color: var(--ink);
  }
  #query:focus { border-color: #c9bda6; box-shadow: 0 0 0 3px rgba(180,83,9,.07); }
  .btn-primary {
    height: 50px; padding: 0 26px; border: none; border-radius: 10px; background: var(--ink);
    color: #fff; font: inherit; font-weight: 700; letter-spacing: .5px; cursor: pointer;
    box-shadow: 0 6px 16px rgba(16,24,40,.2);
  }
  .btn-primary:hover { background: #1d2939; }
  .btn-primary:disabled { opacity: .55; cursor: wait; }

  .quick-row, .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .quick-row { margin-top: 10px; }
  .quick {
    border: 1px dashed #d8cfbe; background: #fbf7ee; color: #7a5a2e;
    border-radius: 999px; padding: 6px 13px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .quick:hover { background: #f7efdf; }
  .quick.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  .budget-row { display: flex; align-items: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .budget-row .label { margin: 0 6px 0 0; }
  .budget-row input {
    width: 118px; height: 38px; border: 1px solid var(--line); border-radius: 8px;
    padding: 0 10px; font: inherit; font-size: 14px; background: #fff; outline: none;
  }
  .hint { color: var(--muted); font-size: 12.5px; }

  .dims { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .dim-title { font-size: 13px; font-weight: 700; margin-bottom: 9px; }
  .dim-title span { color: var(--muted); font-weight: 400; font-size: 11.5px; margin-left: 4px; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .chip:hover { border-color: #c9bda6; }
  .chip.on-care { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip.on-ignore { background: #f2f4f7; border-color: #d0d5dd; color: #98a2b3; text-decoration: line-through; }
  .chip:disabled { opacity: .45; cursor: not-allowed; }

  .error { display: none; margin-top: 14px; background: var(--red-bg); color: var(--red); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; }

  /* ---------- report ---------- */
  .report-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin: 34px 2px 14px; flex-wrap: wrap; }
  .eyebrow { font-size: 10.5px; letter-spacing: 2.4px; color: var(--amber); font-weight: 700; }
  .report-head h2 { margin: 4px 0 0; font-size: 24px; letter-spacing: 1px; }
  .report-meta { color: var(--muted); font-size: 12px; text-align: right; line-height: 1.7; }
  .mode-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--amber-bg); color: var(--amber); font-size: 10.5px; font-weight: 700; letter-spacing: .5px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px 24px; margin-bottom: 16px; box-shadow: 0 6px 22px rgba(16,24,40,.04);
    animation: rise .35s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card-index { font-size: 10.5px; letter-spacing: 2px; color: #98a2b3; font-weight: 700; margin-bottom: 10px; }
  .card h3 { margin: 0 0 8px; font-size: 19px; line-height: 1.6; letter-spacing: .5px; }
  .card p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.8; }

  .positioning { background: var(--ink); color: #fff; border-color: var(--ink); }
  .positioning .card-index { color: #98a2b3; }
  .positioning h3 { color: #fff; }
  .positioning p { color: #d0d5dd; }
  .fit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .fit { background: rgba(255,255,255,.06); border-radius: 10px; padding: 12px 14px; }
  .fit b { font-size: 12px; letter-spacing: .5px; }
  .fit.yes b { color: #86efac; }
  .fit.no b { color: #fca5a5; }
  .fit p { margin-top: 4px; font-size: 13px; color: #d0d5dd; }

  table.matrix { width: 100%; border-collapse: collapse; margin-top: 6px; }
  table.matrix th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 600; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.matrix td { padding: 12px 10px; border-bottom: 1px solid #f0ece2; font-size: 13.5px; vertical-align: top; }
  table.matrix tr:last-child td { border-bottom: none; }
  table.matrix tr.primary td { background: #fffbeb; }
  .model-name { font-weight: 700; }
  .tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10.5px; font-weight: 700; background: var(--amber-bg); color: var(--amber); margin-left: 6px; }
  .muted { color: var(--muted); }

  .price-row { display: grid; grid-template-columns: 150px 1fr 250px; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .price-row:last-child { border-bottom: none; }
  .price-name { font-weight: 700; font-size: 14px; }
  .budget-pill { display: block; margin-top: 4px; font-size: 10.5px; font-weight: 600; color: var(--green); }
  .budget-pill.over { color: var(--red); }
  .budget-pill.low { color: var(--muted); }
  .price-track { height: 14px; background: #f0ece2; border-radius: 999px; position: relative; overflow: hidden; }
  .price-range { position: absolute; top: 0; bottom: 0; background: linear-gradient(90deg, #d97706, #b45309); border-radius: 999px; }
  .price-label { font-size: 13px; font-weight: 700; }
  .price-label em { display: block; font-style: normal; font-weight: 400; color: var(--muted); font-size: 11.5px; margin-top: 3px; }

  .avoid-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px; }
  .avoid { background: #fffaf2; border: 1px solid #f0e2c8; border-radius: 10px; padding: 12px 14px; }
  .avoid h4 { margin: 0 0 8px; font-size: 13.5px; }
  .avoid ul { margin: 0; padding-left: 17px; color: var(--ink-2); font-size: 12.5px; line-height: 1.8; }
  .inspection { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .inspection h4 { margin: 0 0 8px; font-size: 13.5px; }
  .inspection ol { margin: 0; padding-left: 20px; columns: 2; column-gap: 30px; color: var(--ink-2); font-size: 12.8px; line-height: 1.9; }
  .market-note { margin-top: 12px; font-size: 12.5px; color: var(--muted); background: #faf8f2; border-radius: 8px; padding: 9px 12px; }
  .live-evidence { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .live-title { font-size: 12px; font-weight: 700; letter-spacing: .5px; color: var(--amber); margin-bottom: 10px; }
  .live-group { margin-bottom: 10px; }
  .live-group > b { display: block; font-size: 13px; margin-bottom: 4px; }
  .live-group ul { margin: 0; padding-left: 18px; }
  .live-group li { font-size: 12.8px; line-height: 1.7; margin-bottom: 5px; }
  .live-group a { color: var(--blue); text-decoration: none; font-weight: 600; }
  .live-group a:hover { text-decoration: underline; }
  .live-meta { display: block; color: var(--muted); font-size: 11px; }
  .live-line { color: var(--amber); }
  .live-flag { color: var(--amber); font-weight: 700; }
  .rescore-note {
    background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 14px;
    font-size: 12.5px; margin-bottom: 12px; letter-spacing: .3px;
  }

  /* ---------- tabs & free search ---------- */
  .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
  .tab {
    border: 1px solid var(--line); background: #fff; border-radius: 10px;
    padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer; color: var(--muted);
    text-align: left;
  }
  .tab span { display: block; font-weight: 400; font-size: 11px; margin-top: 3px; }
  .tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tab.active span { color: #d0d5dd; }
  .free-item {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; animation: rise .3s ease both;
  }
  .free-item a { color: var(--blue); font-weight: 700; text-decoration: none; font-size: 14.5px; }
  .free-item a:hover { text-decoration: underline; }
  .free-meta { color: var(--muted); font-size: 11.5px; margin-top: 5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .price-badge { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .price-badge.hit { background: var(--green-bg); color: var(--green); }
  .price-badge.miss { background: #f2f4f7; color: var(--ink-2); }
  .price-badge.none { background: #f2f4f7; color: #98a2b3; }
  .free-snippet { color: var(--ink-2); font-size: 12.5px; margin-top: 6px; line-height: 1.65; }
  .free-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin: 20px 2px 12px; }
  .free-head .label { margin: 0; }
  #freeSort { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 12.5px; background: #fff; }

  .recs { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 12px; margin-top: 6px; }
  .rec { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: #fff; }
  .rec.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .rec-label { font-size: 10.5px; letter-spacing: 1.5px; font-weight: 800; color: var(--amber); }
  .rec.primary .rec-label { color: #fbbf24; }
  .rec h4 { margin: 6px 0 4px; font-size: 18px; }
  .rec-price { font-size: 14px; font-weight: 700; }
  .rec-score { display: inline-block; margin: 8px 0; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #f2f4f7; color: var(--ink-2); }
  .rec.primary .rec-score { background: rgba(255,255,255,.12); color: #fff; }
  .rec p { font-size: 12.5px; line-height: 1.8; color: var(--ink-2); }
  .rec.primary p { color: #d0d5dd; }
  .rec-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .rec-tags span { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: #f8f4ea; color: #7a5a2e; }
  .rec.primary .rec-tags span { background: rgba(255,255,255,.1); color: #e5e7eb; }

  .why-not { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .why-not h4 { margin: 0 0 8px; font-size: 13.5px; }
  .why-not li { color: var(--muted); font-size: 12.8px; line-height: 1.9; margin-bottom: 3px; }

  .report-actions { display: flex; gap: 10px; margin: 4px 0 24px; }
  .btn-ghost { border: 1px solid var(--line); background: transparent; color: var(--ink-2); border-radius: 8px; padding: 9px 16px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .btn-ghost:hover { background: #fff; }

  .footnote { color: var(--muted); font-size: 11.5px; line-height: 1.8; margin-top: 18px; }
  .empty { text-align: center; color: var(--muted); padding: 50px 10px; font-size: 14px; }

  @media (max-width: 820px) {
    .dims, .fit-grid, .recs, .avoid-grid { grid-template-columns: 1fr; }
    .price-row { grid-template-columns: 1fr; }
    .inspection ol { columns: 1; }
    table.matrix { display: block; overflow-x: auto; }
  }
  @media print {
    body { background: #fff; }
    .panel, .report-actions, .hero-code, .btn-primary, .quick-row { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    .card { break-inside: avoid; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">
      <div class="brand-mark">尽</div>
      <div>
        <h1>买前尽调</h1>
        <div class="sub">二手数码 · <b>不荐货，只做尽调</b></div>
      </div>
    </div>
    <div class="hero-code">PURCHASE<br/>DUE DILIGENCE</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-mode="card">决策卡模式 <span>三个品类 · 打分推荐</span></button>
    <button class="tab" data-mode="free">自由检索 <span>任意关键词 + 价格区间 · 整理链接</span></button>
  </div>

  <section class="panel" id="cardPanel">
    <div class="label">想买什么</div>
    <div class="search-row">
      <input id="query" placeholder="例如：二手相机 / 二手轻薄本 / 二手手机" autocomplete="off" />
      <button class="btn-primary" id="run">生成决策卡</button>
    </div>
    <div class="quick-row" id="categoryChips"></div>

    <div class="budget-row">
      <span class="label">预算</span>
      <input id="budgetMin" type="number" value="2000" placeholder="最低" />
      <span class="hint">—</span>
      <input id="budgetMax" type="number" value="8000" placeholder="最高" />
      <span class="hint">元（可留空）</span>
    </div>

    <div class="dims">
      <div>
        <div class="dim-title">最在乎 <span>选 2–3 个</span></div>
        <div class="chips" id="careChips"></div>
      </div>
      <div>
        <div class="dim-title">最不在乎 <span>选 1–2 个</span></div>
        <div class="chips" id="ignoreChips"></div>
      </div>
    </div>
    <div class="error" id="error"></div>
  </section>

  <section class="panel" id="freePanel" style="display:none">
    <div class="label">搜什么（任意关键词，不限定品类）</div>
    <div class="search-row">
      <input id="freeQuery" placeholder="例如：佳能 EOS R6 二手 / MacBook Air M2 / 4090 二手" autocomplete="off" />
      <button class="btn-primary" id="freeRun">搜索整理</button>
    </div>
    <div class="budget-row">
      <span class="label">价格区间</span>
      <input id="freeMin" type="number" placeholder="最低" />
      <span class="hint">—</span>
      <input id="freeMax" type="number" placeholder="最高" />
      <span class="hint">元（可留空；从结果里提取价格线索并标注是否命中）</span>
    </div>
    <div class="error" id="freeError"></div>
    <div id="freeResults"></div>
  </section>

  <div id="report"></div>
</div>

<script>
const DEFAULT_PREFS = {
  camera: { care: ["performance", "portability"], ignore: ["battery"] },
  laptop: { care: ["portability", "battery"], ignore: ["performance"] },
  phone: { care: ["camera", "battery"], ignore: ["build"] },
  tablet: { care: ["performance", "screen"], ignore: ["portability"] },
  headphone: { care: ["sound", "battery"], ignore: ["build"] },
};

let META = null;
let currentCategory = null;
const care = new Set();
const ignore = new Set();
let lastReport = null;

const $ = (s) => document.querySelector(s);

async function init() {
  try {
    META = await (await fetch("/api/meta")).json();
  } catch (e) {
    showError("无法连接后端，请确认 server.py 已启动。");
    return;
  }
  renderCategoryChips();
  detectCategory();
  $("#run").addEventListener("click", runAdvise);
  $("#query").addEventListener("input", detectCategory);
  ["budgetMin", "budgetMax"].forEach((id) => {
    document.getElementById(id).addEventListener("input", () => {
      if (lastReport) clientRescore();
    });
  });
}

function renderCategoryChips() {
  const box = $("#categoryChips");
  box.innerHTML = META.categories.map((c) =>
    `<button class="quick" data-key="${c.key}">${c.name}</button>`
  ).join("");
  box.querySelectorAll(".quick").forEach((btn) => {
    btn.addEventListener("click", () => {
      $("#query").value = btn.textContent;
      detectCategory(true);
    });
  });
}

function detectCategory(force = false) {
  if (!META) return;
  const q = ($("#query").value || "").toLowerCase();
  let best = null, bestHits = 0;
  META.categories.forEach((c) => {
    const hits = c.keywords.filter((k) => q.includes(k.toLowerCase())).length;
    if (hits > bestHits) { best = c; bestHits = hits; }
  });
  if (!best) best = META.categories[0];
  if (force || !currentCategory || best.key !== currentCategory.key) {
    currentCategory = best;
    care.clear(); ignore.clear();
    const pref = DEFAULT_PREFS[best.key] || {};
    (pref.care || []).forEach((d) => care.add(d));
    (pref.ignore || []).forEach((d) => ignore.add(d));
    renderDimChips();
    document.querySelectorAll(".quick").forEach((b) => {
      b.classList.toggle("active", b.dataset.key === best.key);
    });
  }
}

function renderDimChips() {
  const careBox = $("#careChips");
  const ignoreBox = $("#ignoreChips");
  careBox.innerHTML = ""; ignoreBox.innerHTML = "";
  currentCategory.dimensions.forEach((dim) => {
    const c = document.createElement("button");
    c.className = "chip";
    c.textContent = dim.label;
    c.dataset.key = dim.key;
    c.addEventListener("click", () => toggleCare(dim.key));
    careBox.appendChild(c);

    const i = document.createElement("button");
    i.className = "chip";
    i.textContent = dim.label;
    i.dataset.key = dim.key;
    i.addEventListener("click", () => toggleIgnore(dim.key));
    ignoreBox.appendChild(i);
  });
  refreshChipStates();
}

function toggleCare(key) {
  if (care.has(key)) care.delete(key);
  else {
    if (care.size >= 3) return;
    care.add(key); ignore.delete(key);
  }
  refreshChipStates();
  if (lastReport) clientRescore();
}
function toggleIgnore(key) {
  if (ignore.has(key)) ignore.delete(key);
  else {
    if (ignore.size >= 2) return;
    ignore.add(key); care.delete(key);
  }
  refreshChipStates();
  if (lastReport) clientRescore();
}
function refreshChipStates() {
  document.querySelectorAll("#careChips .chip").forEach((c) => {
    const key = c.dataset.key;
    c.classList.toggle("on-care", care.has(key));
    c.disabled = ignore.has(key) || (care.size >= 3 && !care.has(key));
  });
  document.querySelectorAll("#ignoreChips .chip").forEach((c) => {
    const key = c.dataset.key;
    c.classList.toggle("on-ignore", ignore.has(key));
    c.disabled = care.has(key) || (ignore.size >= 2 && !ignore.has(key));
  });
}

async function runAdvise() {
  if (care.size < 2) { showError("请至少选择 2 个「最在乎」的维度。"); return; }
  const q = ($("#query").value || "").trim();
  if (q && META) {
    const matched = META.categories.some((c) =>
      c.keywords.some((k) => q.toLowerCase().includes(k.toLowerCase()))
    );
    if (!matched) {
      showError("决策卡暂不支持该品类，可点上方「自由检索」用任意关键词搜索。");
      return;
    }
  }
  const payload = {
    query: q || currentCategory.name,
    budget_min: Number($("#budgetMin").value) || null,
    budget_max: Number($("#budgetMax").value) || null,
    care: [...care],
    ignore: [...ignore],
  };
  const btn = $("#run");
  btn.disabled = true; btn.textContent = "正在尽调…";
  hideError();
  try {
    const resp = await fetch("/api/advise", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || resp.statusText);
    lastReport = data;
    renderReport(data);
    document.querySelector(".report-head")?.scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    showError(e.message);
  } finally {
    btn.disabled = false; btn.textContent = "生成决策卡";
  }
}

function renderReport(data) {
  const r = data;
  const date = r.meta.generated_at || new Date().toLocaleString("zh-CN");
  const html = `
    <div class="report-head">
      <div>
        <div class="eyebrow">PURCHASE DUE DILIGENCE</div>
        <h2>${esc(r.category.name)} · 尽调报告</h2>
      </div>
      <div class="report-meta">
        报告时间 ${esc(date)} · 覆盖 ${r.matrix.length} 款机型<br/>
        ${r.meta.mode === "live" ? `实时检索 ${r.meta.searches || 0} 次 · 今日额度 ${r.meta.quota_used}/${r.meta.quota_limit}${r.meta.live_market_applied ? ` · ${r.meta.live_market_applied} 款按实时线索修正打分` : ""}<br/>` : ""}
        <span class="mode-badge">${r.meta.mode === "mock" ? "MOCK 演示数据" : "LIVE 元宝搜索"}</span>
      </div>
    </div>

    ${r.client_rescored ? `<div class="rescore-note">⚡ 已按当前预算与偏好实时重算（行情线索未重新检索）</div>` : ""}

    <div class="report-actions">
      <button class="btn-ghost" id="copyReport">复制尽调卡</button>
      <button class="btn-ghost" id="printReport">打印 / 导出 PDF</button>
    </div>

    <section class="card positioning">
      <div class="card-index">01 / 定位</div>
      <h3>${esc(r.category.positioning)}</h3>
      <div class="fit-grid">
        <div class="fit yes"><b>适合谁</b><p>${esc(r.category.suitable)}</p></div>
        <div class="fit no"><b>不适合谁</b><p>${esc(r.category.unsuitable)}</p></div>
      </div>
    </section>

    <section class="card">
      <div class="card-index">02 / 型号矩阵</div>
      <table class="matrix">
        <thead><tr><th>型号</th><th>二手价带</th><th>重量</th><th>综合分</th><th>一句话缺点</th></tr></thead>
        <tbody>
          ${r.matrix.map((m) => `
            <tr class="${m.is_primary ? "primary" : ""}">
              <td><span class="model-name">${esc(m.name)}</span>${m.is_primary ? '<span class="tag">首选</span>' : ""}</td>
              <td>¥${num(m.price_used[0])}–${num(m.price_used[1])}</td>
              <td>${m.weight_g} g</td>
              <td><b>${m.score}</b> / 10</td>
              <td class="muted">${esc(m.cons)}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </section>

    <section class="card">
      <div class="card-index">03 / 行情</div>
      ${renderMarket(r.market)}
      ${renderLiveEvidence(r)}
      ${r.budget.note ? `<div class="market-note">⚠ ${esc(r.budget.note)}</div>` : ""}
    </section>

    <section class="card">
      <div class="card-index">04 / 避雷与验机</div>
      <div class="avoid-grid">
        ${r.avoidance.items.map((item) => `
          <div class="avoid"><h4>${esc(item.model)}</h4><ul>${item.pitfalls.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div>
        `).join("")}
      </div>
      <div class="inspection">
        <h4>面交验机清单（按顺序做）</h4>
        <ol>${r.avoidance.inspection.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>
      </div>
      <div class="market-note">${esc(r.avoidance.market_note)}</div>
    </section>

    <section class="card">
      <div class="card-index">05 / 取舍推荐</div>
      <div class="recs" style="grid-template-columns: repeat(${Math.min(3, r.recommendations.length)}, 1fr)">
        ${r.recommendations.map((rec) => `
          <div class="rec ${rec.role}">
            <div class="rec-label">${esc(rec.label)}</div>
            <h4>${esc(rec.model.name)}</h4>
            <div class="rec-price">¥${num(rec.model.price_used[0])}–${num(rec.model.price_used[1])}</div>
            <div class="rec-score">综合 ${rec.model.score} / 10</div>
            <p>${esc(rec.reason)}</p>
            <div class="rec-tags">${rec.model.pros.map((p) => `<span>${esc(p)}</span>`).join("")}</div>
          </div>
        `).join("")}
      </div>
      <div class="why-not">
        <h4>为什么不选另外几款</h4>
        <ul>${r.why_not.map((w) => `<li>${esc(w.text)}</li>`).join("")}</ul>
      </div>
    </section>

    <div class="footnote">
      ${esc(r.meta.data_note)}<br/>
      本报告由「买前尽调」生成：搜索只负责找证据，推荐只负责算取舍。
    </div>
  `;
  $("#report").innerHTML = html;
  $("#copyReport").addEventListener("click", copyReport);
  $("#printReport").addEventListener("click", () => window.print());
}

function renderMarket(market) {
  const max = Math.max(...market.map((m) => Math.max(m.new_price, m.eff_high ?? m.used_high, m.used_high)), 1);
  return market.map((m) => {
    const lo = m.eff_low ?? m.used_low;
    const hi = m.eff_high ?? m.used_high;
    const left = (lo / max) * 100;
    const width = Math.max(1, ((hi - lo) / max) * 100);
    const statusClass = m.budget_status === "预算内" ? "" : (m.budget_status === "略超预算" ? "over" : "low");
    const liveLine = m.live
      ? `实时线索 ¥${num(m.live.low)}–${num(m.live.high)} · 中位 ¥${num(m.live.median)}（${m.live.count} 条来源${m.live.reliable ? "，已参与打分" : "，仅供参考"}）`
      : "";
    return `
      <div class="price-row">
        <div class="price-name">${esc(m.name)}<span class="budget-pill ${statusClass}">${esc(m.budget_status)}</span></div>
        <div class="price-track"><div class="price-range" style="left:${left}%;width:${width}%"></div></div>
        <div class="price-label">¥${num(m.used_low)}–${num(m.used_high)} 精选参考
          <em>当年新品 ¥${num(m.new_price)} · 折价约 ${Math.round(m.depreciation * 100)}%${m.price_source === "live" ? ' · <b class="live-flag">实时修正</b>' : ""}</em>
          ${liveLine ? `<em class="live-line">${esc(liveLine)}</em>` : ""}
        </div>
      </div>`;
  }).join("");
}

function renderLiveEvidence(r) {
  if (r.meta.mode !== "live") return "";
  if (r.meta.quota_exceeded) {
    return `<div class="market-note">⚠ 今日实时检索额度已用完，本报告基于精选数据生成，行情部分未联网刷新。</div>`;
  }
  const groups = (r.evidence || []).filter((e) => e.items && e.items.length);
  if (!groups.length) {
    return r.meta.search_error ? `<div class="market-note">⚠ ${esc(r.meta.search_error)}</div>` : "";
  }
  return `
    <div class="live-evidence">
      <div class="live-title">实时行情线索 · 元宝搜索（点击回原文）</div>
      ${groups.map((g) => `
        <div class="live-group">
          <b>${esc(g.model)}</b>
          <ul>
            ${g.items.map((it) => `
              <li>
                <a href="${esc(it.url || "#")}" target="_blank" rel="noreferrer">${esc(it.title)}</a>
                <span class="live-meta">${esc(it.site || "未知来源")} · ${esc(it.date || "无日期")} · 抓取 ${esc(g.fetched_at)}${g.cached ? " · 缓存" : ""}</span>
              </li>`).join("")}
          </ul>
        </div>`).join("")}
    </div>`;
}

function clientRescore() {
  if (!lastReport) return;
  const r = lastReport;
  const dims = r.category.dimensions.map((d) => d.key);
  const minB = parseFloat($("#budgetMin").value) || null;
  const maxB = parseFloat($("#budgetMax").value) || null;
  const inBudget = (m) => {
    const rel = m.live_band && m.live_band.reliable;
    const lo = rel ? m.live_band.low : m.price_used[0];
    const hi = rel ? m.live_band.high : m.price_used[1];
    if (maxB && lo > maxB) return false;
    if (minB && hi < minB) return false;
    return true;
  };
  const visible = r.models.filter(inBudget);
  if (!visible.length) return; // 全部超出预算时保留原报告

  // 有效基准价：可信实时线索用中位价，否则精选参考价
  visible.forEach((m) => {
    m.mid_price = (m.live_band && m.live_band.reliable)
      ? m.live_band.median
      : (m.price_used[0] + m.price_used[1]) / 2;
  });

  // 归一化（镜像后端：在当前候选集内归一）
  const mids = visible.map((m) => m.mid_price);
  const ws = visible.map((m) => m.weight_g);
  const norm = (v, a, b) => (b <= a ? 1 : Math.max(0, Math.min(1, (v - a) / (b - a))));
  visible.forEach((m) => {
    m.attrs = Object.assign({}, m.attrs, {
      price: 1 - norm(m.mid_price, Math.min(...mids), Math.max(...mids)),
      portability: 1 - norm(m.weight_g, Math.min(...ws), Math.max(...ws)),
    });
  });

  // 权重打分（镜像后端：在乎 2.5 / 不在乎 0.15 / 其他 1.0）
  const weights = {};
  dims.forEach((d) => { weights[d] = 1; });
  [...care].forEach((d) => { if (weights[d] != null) weights[d] = 2.5; });
  [...ignore].forEach((d) => { if (weights[d] != null) weights[d] = 0.15; });
  visible.forEach((m) => {
    const tw = dims.reduce((s, d) => s + weights[d], 0);
    const sc = dims.reduce((s, d) => s + weights[d] * (m.attrs[d] ?? 0.5), 0) / Math.max(tw, 1e-9);
    m.score = Math.round(sc * 100) / 10;
  });

  // 推荐位（镜像后端规则）
  const ranked = [...visible].sort((a, b) => b.score - a.score);
  const primary = ranked[0];
  const cheaper = ranked.filter((m) => m.id !== primary.id && m.mid_price < primary.mid_price - 100);
  const save = cheaper[0] || null;
  const pricier = ranked.filter((m) => m.mid_price > primary.mid_price);
  let upgrade = null, upgradeLabel = "进阶选";
  if (pricier.length) {
    upgrade = pricier.reduce((a, b) => (b.score > a.score ? b : a));
    upgradeLabel = "加钱选";
  } else {
    const alt = ranked.filter((m) => m.id !== primary.id);
    if (alt.length) upgrade = alt.reduce((a, b) => ((b.scores?.performance || 0) > (a.scores?.performance || 0) ? b : a));
  }
  const fmt = (v) => "¥" + Math.round(v).toLocaleString("zh-CN");
  const labelOf = (d) => (r.category.dimensions.find((x) => x.key === d) || {}).label;
  const careLabels = [...care].filter((d) => dims.includes(d)).map(labelOf).filter(Boolean);
  const ignoreLabels = [...ignore].filter((d) => dims.includes(d)).map(labelOf).filter(Boolean);
  const weightText = `你在乎：${careLabels.join("、") || "无"}；不在乎：${ignoreLabels.join("、") || "无"}。`;
  const reason = (m, role) => {
    const p = [`按你的权重计算，综合得分 ${m.score}/10。${weightText}`];
    if (role === "primary") {
      p.push(`它在 ${m.name} 这一档里最贴合你的需求。`);
    } else if (role === "save") {
      const diff = primary.mid_price - m.mid_price;
      p.push(diff > 0 ? `比首选便宜约 ${fmt(diff)}，适合把预算压到最低。` : "是预算内更稳妥的选择。");
    } else {
      const diff = m.mid_price - primary.mid_price;
      p.push(diff > 0 ? `比首选贵约 ${fmt(diff)}，换来的是：${m.pros.slice(0, 2).join("、")}。` : `它的强项是：${m.pros.slice(0, 2).join("、")}。`);
      if (m.score < primary.score - 0.3) {
        p.push(`但综合分 ${m.score} 低于首选 ${primary.score}——只有当你更看重这些强项、愿意牺牲其他维度时才值得考虑。`);
      }
    }
    return p.join("");
  };
  const recs = [];
  const used = new Set();
  [["primary", primary], ["save", save], ["upgrade", upgrade]].forEach(([role, m]) => {
    if (!m || used.has(m.id)) return;
    used.add(m.id);
    recs.push({ role, label: { primary: "首选", save: "省钱选", upgrade: upgradeLabel }[role], model: m, reason: reason(m, role) });
  });
  const whyNot = ranked.filter((m) => m.id !== primary.id).map((m) => {
    const diff = m.mid_price - primary.mid_price;
    const dir = diff > 0 ? `贵约 ${fmt(diff)}` : `便宜约 ${fmt(-diff)}`;
    return { model: m.name, text: `${m.name}：比首选${dir}，优势是「${m.pros.slice(0, 2).join("、")}」；但短板「${m.cons[0]}」会把综合分拉下来，所以在你的权重下排在后面。` };
  });

  r.matrix = visible.map((m) => ({ name: m.name, price_used: m.price_used, weight_g: m.weight_g, score: m.score, cons: m.cons[0], pros: m.pros.slice(0, 2), is_primary: m.id === primary.id }));
  r.market = visible.map((m) => {
    const rel = m.live_band && m.live_band.reliable;
    const effLo = rel ? m.live_band.low : m.price_used[0];
    const effHi = rel ? m.live_band.high : m.price_used[1];
    let status = "预算内";
    if (maxB && effLo > maxB) status = "略超预算";
    else if (minB && effHi < minB) status = "低于预算";
    return { name: m.name, used_low: m.price_used[0], used_high: m.price_used[1], eff_low: effLo, eff_high: effHi, new_price: m.price_new, depreciation: Math.round((1 - m.mid_price / m.price_new) * 100) / 100, budget_status: status, price_source: rel ? "live" : "curated", live: m.live_band };
  });
  r.recommendations = recs;
  r.why_not = whyNot;
  r.client_rescored = true;
  renderReport(r);
}

function copyReport() {
  if (!lastReport) return;
  const r = lastReport;
  const lines = [`【买前尽调】${r.category.name} · ${r.meta.generated_at || ""}`, "", "定位：" + r.category.positioning, ""];
  lines.push("型号矩阵：");
  r.matrix.forEach((m) => lines.push(`- ${m.name}｜二手 ¥${m.price_used[0]}–${m.price_used[1]}｜${m.weight_g}g｜${m.score}/10｜${m.cons}`));
  lines.push("", "取舍推荐：");
  r.recommendations.forEach((rec) => lines.push(`- 【${rec.label}】${rec.model.name}：${rec.reason}`));
  lines.push("", "避雷：");
  r.avoidance.items.forEach((item) => lines.push(`- ${item.model}：${item.pitfalls.join("、")}`));
  lines.push("", "面交验机清单：");
  r.avoidance.inspection.forEach((x, i) => lines.push(`${i + 1}. ${x}`));
  navigator.clipboard.writeText(lines.join("\n")).then(() => {
    const btn = $("#copyReport");
    btn.textContent = "已复制 ✓";
    setTimeout(() => { btn.textContent = "复制尽调卡"; }, 1500);
  });
}

function showError(msg) { const e = $("#error"); e.textContent = msg; e.style.display = "block"; }
function hideError() { $("#error").style.display = "none"; }
function num(n) { return Number(n).toLocaleString("zh-CN"); }
function esc(s) {
  return String(s == null ? "" : s)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}

/* ---------- 自由检索模式 ---------- */
let lastFree = null;

document.querySelectorAll(".tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b === btn));
    const mode = btn.dataset.mode;
    $("#cardPanel").style.display = mode === "card" ? "" : "none";
    $("#freePanel").style.display = mode === "free" ? "" : "none";
    $("#report").style.display = mode === "card" ? "" : "none";
  });
});
$("#freeRun").addEventListener("click", runFreeSearch);
$("#freeQuery").addEventListener("keydown", (e) => { if (e.key === "Enter") runFreeSearch(); });

async function runFreeSearch() {
  const q = $("#freeQuery").value.trim();
  const err = $("#freeError");
  err.style.display = "none";
  if (!q) { err.textContent = "请输入关键词。"; err.style.display = "block"; return; }
  const btn = $("#freeRun");
  btn.disabled = true; btn.textContent = "搜索整理…";
  try {
    const resp = await fetch("/api/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query: q,
        price_min: parseFloat($("#freeMin").value) || null,
        price_max: parseFloat($("#freeMax").value) || null,
      }),
    });
    const d = await resp.json();
    if (!resp.ok) throw new Error(d.error || resp.statusText);
    lastFree = d;
    renderFree(d);
  } catch (e) {
    err.textContent = "检索失败：" + e.message;
    err.style.display = "block";
  } finally {
    btn.disabled = false; btn.textContent = "搜索整理";
  }
}

function freeSortItems(items, mode) {
  if (mode === "relevance") return items;
  const key = (it) => (it.prices && it.prices.length ? it.prices[0] : null);
  const has = items.filter((it) => key(it) !== null);
  const none = items.filter((it) => key(it) === null);
  has.sort((a, b) => (mode === "price_desc" ? key(b) - key(a) : key(a) - key(b)));
  return has.concat(none);
}

function priceBadge(it) {
  if (it.price_hit === true) {
    const range = it.prices.length ? ` · ¥${num(Math.min(...it.prices))}–${num(Math.max(...it.prices))}` : "";
    return `<span class="price-badge hit">命中区间${range}</span>`;
  }
  if (it.price_hit === false) {
    return `<span class="price-badge miss">区间外 ¥${it.prices.map(num).join(" / ")}</span>`;
  }
  if (it.prices && it.prices.length) {
    return `<span class="price-badge none">价格线索 ¥${it.prices.map(num).join(" / ")}</span>`;
  }
  return `<span class="price-badge none">未识别价格</span>`;
}

function freeListHTML(items) {
  return items.map((it) => `
    <div class="free-item">
      <a href="${esc(it.url || "#")}" target="_blank" rel="noreferrer">${esc(it.title || "无标题")}</a>
      <div class="free-meta">
        ${priceBadge(it)}
        <span>${esc(it.site || "未知来源")}</span>
        <span>${esc(it.date || "无日期")}</span>
        <span>相关度 ${(it.score * 100).toFixed(0)}%</span>
      </div>
      <div class="free-snippet">${esc((it.passage || "").slice(0, 140))}${(it.passage || "").length > 140 ? "…" : ""}</div>
    </div>`).join("");
}

function renderFree(d) {
  const box = $("#freeResults");
  if (d.note) {
    box.innerHTML = `<div class="market-note">${esc(d.note)}</div>`;
    return;
  }
  const ranged = d.price_min != null || d.price_max != null;
  box.innerHTML = `
    <div class="free-head">
      <div class="label">「${esc(d.query)}」整理结果 · ${d.total} 条${ranged ? ` · 价格命中 ${d.hits} 条` : ""}${d.cached ? " · 缓存" : ""}</div>
      <select id="freeSort">
        <option value="relevance">按相关度</option>
        <option value="price_asc">价格从低到高</option>
        <option value="price_desc">价格从高到低</option>
      </select>
    </div>
    <div id="freeList">${freeListHTML(d.items)}</div>`;
  $("#freeSort").addEventListener("change", () => {
    $("#freeList").innerHTML = freeListHTML(freeSortItems(d.items, $("#freeSort").value));
  });
}

init();
</script>
